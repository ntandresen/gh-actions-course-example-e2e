name: E2E tests
on:
  workflow_dispatch:
  workflow_call:
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ntandresen/gh-actions-course-example-e2e
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Run E2E tests
        run: npm run test:e2e
